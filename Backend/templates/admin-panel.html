<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - CertAuth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        
        .header h1 {
            color: #1e3c72;
            font-size: 28px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #2180bd 0%, #1a66a5 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(33, 128, 189, 0.2);
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #1e3c72;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #1e3c72;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2180bd;
            box-shadow: 0 0 0 3px rgba(33, 128, 189, 0.1);
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #2180bd;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1a66a5;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }
        
        .message.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .message.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        table thead {
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }
        
        table th {
            padding: 12px;
            text-align: left;
            color: #1e3c72;
            font-weight: 600;
            font-size: 14px;
        }
        
        table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
            word-break: break-all;
        }
        
        table tr:hover {
            background: #f8f9fa;
        }
        
        .back-link {
            text-align: center;
            margin-top: 30px;
        }
        
        .back-link a {
            color: #2180bd;
            text-decoration: none;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            table {
                font-size: 12px;
            }
            
            table th, table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div>
                <h1>🔒 Admin Panel</h1>
            </div>
            <div>
                <span style="color: #666; font-size: 14px;">Admin: <strong id="adminAddress">{{ wallet_address }}</strong></span>
            </div>
        </div>

        <!-- MESSAGE -->
        <div class="message" id="message"></div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalCerts">-</div>
                <div class="stat-label">Total Certificates</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">-</div>
                <div class="stat-label">Active Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayIssued">-</div>
                <div class="stat-label">Issued Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="verifyRate">-</div>
                <div class="stat-label">Verify Rate</div>
            </div>
        </div>

        <!-- MANAGEMENT SECTION -->
        <div class="section">
            <h2>📋 Certificate Management</h2>
            
            <div style="margin-bottom: 20px;">
                <input 
                    type="text" 
                    id="searchHash" 
                    placeholder="Search by certificate hash..." 
                    style="padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%;"
                />
            </div>
            
            <table id="certTable">
                <thead>
                    <tr>
                        <th>Certificate Hash</th>
                        <th>Recipient</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4" style="text-align: center; color: #999;">Loading certificates...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- SYSTEM SETTINGS -->
        <div class="section">
            <h2>⚙️ System Settings</h2>
            
            <div class="form-group">
                <label>Contract Address</label>
                <input type="text" id="contractAddress" readonly />
            </div>
            
            <div class="form-group">
                <label>Network</label>
                <input type="text" value="Ganache (localhost:8545)" readonly />
            </div>
        </div>

        <!-- EXPORT DATA -->
        <div class="section">
            <h2>📊 Export Data</h2>
            
            <button class="btn btn-primary" onclick="exportCertificates()">
                📥 Export Certificates (CSV)
            </button>
            <button class="btn btn-primary" style="margin-left: 10px;" onclick="exportStatistics()">
                📥 Export Statistics (JSON)
            </button>
        </div>

        <!-- BACK LINK -->
        <div class="back-link">
            <a href="/dashboard">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        // Load admin data on page load
        window.addEventListener('load', async () => {
            // Check authentication
            try {
                const authResponse = await fetch('/api/auth/status');
                const authData = await authResponse.json();
                
                if (!authData.authenticated) {
                    window.location.href = '/login';
                    return;
                }
            } catch (e) {
                window.location.href = '/login';
            }
            
            // Load contract address
            try {
                const contractResponse = await fetch('/api/contract-address');
                const contractData = await contractResponse.json();
                document.getElementById('contractAddress').value = contractData.contract_address || 'Not set';
            } catch (e) {
                console.error('Error loading contract address:', e);
            }
            
            // Load statistics
            loadStatistics();
        });

        async function loadStatistics() {
            // Placeholder statistics - in production, these would come from your backend
            document.getElementById('totalCerts').textContent = '256';
            document.getElementById('totalUsers').textContent = '48';
            document.getElementById('todayIssued').textContent = '12';
            document.getElementById('verifyRate').textContent = '99.8%';
        }

        function exportCertificates() {
            showMessage('Export functionality coming soon', 'info');
        }

        function exportStatistics() {
            showMessage('Export functionality coming soon', 'info');
        }

        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message show ${type}`;
            
            setTimeout(() => {
                messageDiv.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
